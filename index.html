<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josa Game</title>
    <link rel="stylesheet" type="text/css" href="./styles/main.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>한국어로 연습 준비됐어요?</h1>
            <p>한국어 조사를 연습하는 작은 게임입니다</p>
            <button id="start-btn">시작</button>
        </div>
        <div class="screen" id="game-screen">
            <div class="game-header">
                <h2 class="question-text">Question</h2>
                <div class="game-info">
                    <p>질문 <span id="current-question">1</span> / <span id="total-questions">10</span> </p>
                    <p>점수: <span id="score">0</span> </p>
                </div>
            </div>
            <div class="answers-container" id="answers-container">
                <!--Game answers would be here
                -->
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        
        <div class="screen" id="result-screen">
            <h1>게임 결과</h1>
            <div class="result-info">
                <p>점수: <span id="final-score">0</span> / <span id="max-score">10</span></p>
                <div id="result-message">수고했어요!</div>
            </div>
            <button id="restart-btn">다시 시작</button>
        </div>
    </div>
    <script type="text/javascript" src="./js/main.js"></script>
</body>
</html>
