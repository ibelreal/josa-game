<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josa Game</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="game-start">
            <h1>한국어로 연습 준비됐어요?</h1>
            <p>한국어 조사를 연습하는 작은 게임입니다</p>
            <button id="start-btn">시작</button>
        </div>
    </div>
    <div class="screen" id="game-screen">
        <div class="game-header">
            <h2 class="question-text">Question</h2>
            <p>질문 <span id="current-question">1</span> / <span id="last-question">10</span> </p>
            <p>점수: <span id="score">0</span> </p>
        </div>
        <div id="game-answers" class="game-answers">
            <!--Game answers would be here
        -->
        </div>
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>
    </div>

    <div class="screen" id="game-results">
        <h1>게임 결과</h1>
        <div class="result-info">
            <p>점수: <span id="final-score">0</span> / <span id="max-score">10</span></p>
            <div id="result-message">수고했어요!</div>
        </div>
        <button id="restart-btn">다시 시작</button>
    </div>
    
</body>
</html>
